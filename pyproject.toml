[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftqec"
version = "0.1.0"
description = "Generic stabilizer extraction architecture synthesis research core"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ftqec = "ftqec.cli:main"

[project.optional-dependencies]
verification = ["jsonschema>=4"]

[tool.setuptools.packages.find]
where = ["src"]
