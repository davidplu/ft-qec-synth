[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftqec"
version = "0.4.0"
description = "Generic stabilizer extraction architecture synthesis research core"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ftqec = "ftqec.resource_synthesis.entrypoint:main"
ftqec-v03 = "ftqec.cli:main"

[project.optional-dependencies]
verification = ["jsonschema>=4"]
dev = ["pytest>=8", "jsonschema>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
